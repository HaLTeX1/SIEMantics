<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SIEMantics - Riasztás részletei</title>
<style>
  :root {
    color-scheme: dark;
    --page:        #0d0d0d;
    --surface:     #1a1a19;
    --surface-2:   #202020;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --border:      rgba(255,255,255,0.10);
    --accent:      #3987e5;
    --good:        #0ca30c;
    --warning:     #fab219;
    --serious:     #ec835a;
    --critical:    #d03b3b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
  }

  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 20px 48px; }

  h1 { font-size: 17px; margin: 0 0 4px; }
  .sub { color: var(--text-muted); font-size: 12px; margin-bottom: 20px; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .badge-fill-good     { background: rgba(12,163,12,0.16);  color: #7be07b; }
  .badge-fill-warning  { background: rgba(250,178,25,0.16); color: #fdd68a; }
  .badge-fill-serious  { background: rgba(236,131,90,0.16); color: #f3b299; }
  .badge-fill-critical { background: rgba(208,59,59,0.18);  color: #f29b9b; }
  .badge-fill-muted    { background: rgba(255,255,255,0.06); color: var(--text-secondary); }

  .badges-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px 24px;
  }
  .field.full-width { grid-column: 1 / -1; }
  .field .label {
    color: var(--text-muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  .field .value { color: var(--text-primary); word-break: break-word; }
  .field .value.mono {
    white-space: pre-wrap;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 12.5px;
    color: var(--text-secondary);
    font-family: ui-monospace, Consolas, monospace;
  }

  .ioc-chip {
    display: inline-block;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 2px 8px;
    margin: 2px 4px 2px 0;
    font-size: 12px;
    font-family: ui-monospace, Consolas, monospace;
    color: var(--text-secondary);
  }

  a.iris-link { color: var(--accent); text-decoration: none; }
  a.iris-link:hover { text-decoration: underline; }

  .state { padding: 40px 10px; text-align: center; color: var(--text-muted); }
  .state.error { color: var(--critical); }

  .ti-entry {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 6px;
    font-size: 12.5px;
  }
  .ti-entry .ti-ioc {
    font-family: ui-monospace, Consolas, monospace;
    font-weight: 600;
    margin-bottom: 3px;
  }
  .ti-entry .ti-line { color: var(--text-secondary); }
  .ti-entry .ti-none { color: var(--text-muted); font-style: italic; }
  .field .value ul.analysis-list,
  .field .value ol.analysis-list { margin: 0; padding-left: 20px; }
  .field .value .analysis-list li + li { margin-top: 4px; }
  .field .value.closure-note { white-space: pre-wrap; }
  .hint { color: var(--text-muted); }

  .timeline { display: grid; gap: 2px; }
  .tl-row { display: grid; grid-template-columns: 72px 44px minmax(0, 1fr); gap: 10px; padding: 7px 8px; border-radius: 6px; align-items: start; }
  .tl-row:hover { background: rgba(255,255,255,0.03); }
  .tl-row.self { background: rgba(57,135,229,0.12); outline: 1px solid rgba(57,135,229,0.45); }
  .tl-time { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .tl-level { font-size: 11px; font-weight: 700; text-align: center; border-radius: 4px; padding: 1px 0; }
  .tl-level.l-crit { background: rgba(208,59,59,0.18); color: #f29b9b; }
  .tl-level.l-high { background: rgba(236,131,90,0.16); color: #f3b299; }
  .tl-level.l-med { background: rgba(250,178,25,0.16); color: #fdd68a; }
  .tl-level.l-low { background: rgba(255,255,255,0.06); color: var(--text-secondary); }
  .tl-main { min-width: 0; }
  .tl-rule { font-size: 13px; }
  .tl-meta { color: var(--text-muted); font-size: 12px; }
  .tl-log { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: var(--text-secondary); overflow-wrap: anywhere; margin-top: 2px; }
  .tl-tools { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .tl-tools select { background: var(--page); color: var(--text-primary); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 13px; }
  .self-tag { font-size: 11px; font-weight: 600; color: #8fb8ef; margin-left: 6px; }
  h2.panel-title { font-size: 13px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; margin: 22px 0 8px; }
  .response-panel { display: block; }
  .response-control { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .response-control input, .response-control select {
    background: var(--page, #0d0d0d);
    color: var(--text-primary);
    border: 1px solid var(--border, rgba(255,255,255,0.10));
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 13px;
  }
  .response-control input { width: 150px; font-family: ui-monospace, Consolas, monospace; }
  .response-control button {
    border-radius: 6px;
    border: 1px solid #ec835a;
    color: #ec835a;
    background: transparent;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .response-control button:hover { background: rgba(236,131,90,0.12); }
  .response-control button:disabled { opacity: 0.5; cursor: default; }
  .response-msg { font-size: 12.5px; margin-top: 8px; }
  .response-msg.error { color: #f29b9b; }
  .response-msg.ok { color: #7be07b; }
  .response-history { margin-top: 10px; display: grid; gap: 6px; font-size: 12.5px; }
  .response-history .ok { color: #7be07b; }
  .response-history .bad { color: #f29b9b; }
  .response-history .muted { color: var(--text-muted); }
  .field .value.review-reason {
    background: rgba(250,178,25,0.10);
    border: 1px solid rgba(250,178,25,0.35);
    border-radius: 6px;
    padding: 8px 12px;
    color: #fdd68a;
  }

</style>
</head>
<body>
  <div class="wrap" id="content">
    <div class="state" id="loadingState">Betöltés...</div>
  </div>

<script src="auth.js"></script>
<script>
(function () {
  "use strict";

  const params = new URLSearchParams(window.location.search);
  const alertId = params.get("id");
  const content = document.getElementById("content");
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function fmtTime(iso) {
    if (!iso) return "-";
    const d = new Date(iso + (iso.endsWith("Z") ? "" : "Z"));
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleString("hu-HU", { year: "numeric", month: "short", day: "2-digit", hour: "2-digit", minute: "2-digit" });
  }

  function severityInfo(level) {
    if (level >= 12) return { label: "Critical", cls: "critical" };
    if (level >= 9) return { label: "High", cls: "serious" };
    if (level >= 5) return { label: "Medium", cls: "warning" };
    return { label: "Low", cls: "good" };
  }

  function statusInfo(status) {
    if (status === "escalated") return { label: "Escalated", cls: "good" };
    if (status === "error") return { label: "Error", cls: "critical" };
    if (status === "needs_review") return { label: "Needs review", cls: "warning" };
    if (status === "queued") return { label: "Queued", cls: "muted" };
    return { label: "Suppressed", cls: "muted" };
  }

  function dispositionInfo(groundTruth) {
    if (groundTruth === "true_positive") return { label: "Confirmed TP", cls: "good" };
    if (groundTruth === "false_positive") return { label: "Confirmed FP", cls: "serious" };
    return { label: "Undetermined", cls: "muted" };
  }

  function badge(label, cls) {
    return `<span class="badge badge-fill-${cls}"><span class="dot" style="background:currentColor"></span>${escapeHtml(label)}</span>`;
  }

  function field(label, valueHtml, opts) {
    opts = opts || {};
    const cls = "value" + (opts.mono ? " mono" : "") + (opts.cls ? " " + opts.cls : "");
    return `<div class="field${opts.fullWidth ? " full-width" : ""}">
      <div class="label">${escapeHtml(label)}</div>
      <div class="${cls}">${valueHtml}</div>
    </div>`;
  }

  // LLM strukturalt elemzes (llm_analysis): kulcs -> [cimke, szamozott?]
  const ANALYSIS_LISTS = [
    ["immediate_actions", "Azonnali teendők (L1)", true],
    ["investigation_steps", "Vizsgálati lépések (L2)", true],
    ["escalation_criteria", "Eszkalálni kell, ha", false],
    ["benign_explanations", "Lehetséges ártalmatlan magyarázatok", false],
    ["mitre_techniques", "MITRE ATT&CK", false],
    ["missing_information", "Hiányzó információ", false],
  ];

  function renderAnalysisFields(analysis) {
    if (!analysis) return [];
    const out = [];
    if (analysis.potential_impact) {
      out.push(field("Lehetséges hatás", escapeHtml(analysis.potential_impact), { fullWidth: true }));
    }
    for (const [key, label, numbered] of ANALYSIS_LISTS) {
      const items = analysis[key];
      if (!Array.isArray(items) || items.length === 0) continue;
      const tag = numbered ? "ol" : "ul";
      const lis = items.map((item) => `<li>${escapeHtml(item)}</li>`).join("");
      out.push(field(label, `<${tag} class="analysis-list">${lis}</${tag}>`, { fullWidth: true }));
    }
    return out;
  }

  function renderTiSection(a) {
    if (a.ioc_enrichment && a.ioc_enrichment.length > 0) {
      const entries = a.ioc_enrichment.map((e) => {
        const lines = [];
        if (e.virustotal) {
          const vt = e.virustotal;
          lines.push(`<div class="ti-line">VT: ${vt.malicious} malicious / ${vt.suspicious} suspicious (reputation ${vt.reputation ?? "-"}, ${escapeHtml(vt.country || "?")}, ${escapeHtml(vt.as_owner || "unknown AS")})</div>`);
        }
        if (e.abuseipdb) {
          const ab = e.abuseipdb;
          lines.push(`<div class="ti-line">AbuseIPDB: ${ab.abuse_confidence_score}% confidence, ${ab.total_reports ?? 0} reports (${escapeHtml(ab.country_code || "?")}, ${escapeHtml(ab.isp || "unknown ISP")})</div>`);
        }
        if (lines.length === 0) lines.push('<div class="ti-none">nincs enrichment adat</div>');
        return `<div class="ti-entry"><div class="ti-ioc">${escapeHtml(e.ioc)}</div>${lines.join("")}</div>`;
      }).join("");
      return field("Threat Intelligence", entries, { fullWidth: true });
    }
    if (a.llm_iocs && a.llm_iocs.length > 0) {
      const chips = a.llm_iocs.map((ioc) => `<span class="ioc-chip">${escapeHtml(ioc)}</span>`).join("");
      return field("IoC-k", chips, { fullWidth: true });
    }
    return null;
  }

  // --- Valaszlepes: IP blokkolas Wazuh Active Response-szal (csak ezen az oldalon) ---

  const IPV4 = /^\d{1,3}(\.\d{1,3}){3}$/;
  const response = { enabled: false, user: null, actions: [], form: null, busy: false, message: "", error: false };
  let view = null;

  function candidateIps(a) {
    return Array.from(new Set([a.source_ip, ...(a.llm_iocs || [])].filter((v) => v && IPV4.test(v))));
  }

  function responseHistoryHtml() {
    if (!response.actions.length) return '<div class="response-history"><span class="muted">Még nem volt válaszlépés.</span></div>';
    return `<div class="response-history">${response.actions.map((r) => {
      const who = r.automatic ? "automatikus" : (r.requested_by ? (r.requested_by.full_name || r.requested_by.username) : "-");
      const active = new Date(r.expires_at + (r.expires_at.endsWith("Z") ? "" : "Z")) > new Date();
      const label = { sent: "blokkolva", partial: "részben blokkolva", failed: "sikertelen",
                      dry_run: "próba: blokkolta volna" }[r.status] || r.status;
      // Proba futasnal ok = null: nem ment parancs, nem hiba.
      const targets = (r.targets || []).map((t) => `${escapeHtml(t.name || t.id)}${t.ok === false ? " ✗" : ""}`).join(", ");
      const cls = r.status === "sent" ? "ok" : r.status === "dry_run" ? "muted" : "bad";
      return `<div><span class="${cls}">${escapeHtml(r.ip)} ${label}</span>
        <span class="muted">· ${escapeHtml(who)}, ${fmtTime(r.created_at)} · ${active ? "lejár: " + fmtTime(r.expires_at) : "lejárt"}
        · ${targets}${r.error_detail ? " · " + escapeHtml(r.error_detail) : ""}</span></div>`;
    }).join("")}</div>`;
  }

  function responsePanel(a) {
    if (!response.enabled) return "";
    const ips = candidateIps(a);
    const canBlock = !!(response.user && response.user.can_block_ip);
    let control = "";
    if (canBlock && ips.length) {
      const form = response.form || (response.form = { ip: ips[0], scope: "agent", duration: "24" });
      control = `<div class="response-control">
          <input id="respIp" value="${escapeHtml(form.ip)}" list="respIps" />
          <datalist id="respIps">${ips.map((ip) => `<option value="${escapeHtml(ip)}"></option>`).join("")}</datalist>
          <select id="respScope">
            <option value="agent" ${form.scope === "agent" ? "selected" : ""}>Érintett host (${escapeHtml(a.agent_name || "-")})</option>
            <option value="all" ${form.scope === "all" ? "selected" : ""}>Minden aktív agent</option>
          </select>
          <select id="respDuration">
            ${[["1", "1 óra"], ["24", "24 óra"], ["168", "7 nap"]].map(([v, l]) =>
              `<option value="${v}" ${form.duration === v ? "selected" : ""}>${l}</option>`).join("")}
          </select>
          <button type="button" id="respBtn" ${response.busy ? "disabled" : ""}>${response.busy ? "Blokkolás..." : "IP blokkolása"}</button>
        </div>`;
    }
    const msg = response.message ? `<div class="response-msg ${response.error ? "error" : "ok"}">${escapeHtml(response.message)}</div>` : "";
    return `<h2 class="panel-title">Válaszlépés</h2>
      <div class="panel response-panel">${control}${msg}${responseHistoryHtml()}</div>`;
  }

  function bindResponse(a) {
    const btn = document.getElementById("respBtn");
    if (!btn) return;
    const sync = () => {
      response.form = {
        ip: document.getElementById("respIp").value,
        scope: document.getElementById("respScope").value,
        duration: document.getElementById("respDuration").value,
      };
    };
    ["respIp", "respScope", "respDuration"].forEach((id) => {
      document.getElementById(id).addEventListener("input", sync);
      document.getElementById(id).addEventListener("change", sync);
    });
    btn.addEventListener("click", () => { sync(); blockIp(a); });
  }

  async function errorDetail(res) {
    try {
      const body = await res.json();
      if (typeof body.detail === "string") return body.detail;
    } catch (_) { /* nem JSON */ }
    return `HTTP ${res.status}`;
  }

  async function blockIp(a) {
    const form = response.form;
    const where = form.scope === "all" ? "MINDEN aktív agenten" : `a(z) ${a.agent_name || "érintett"} hoston`;
    const hours = { "1": "1 órára", "24": "24 órára", "168": "7 napra" }[form.duration];
    if (!window.confirm(`${form.ip} blokkolása ${where}, ${hours}. A blokk a lejáratkor magától feloldódik. Folytatod?`)) return;
    response.busy = true;
    response.message = "";
    rerender();
    try {
      const res = await SIEM.api(`/api/v1/alerts/${encodeURIComponent(a.display_id)}/block-ip`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ip: form.ip.trim(), scope: form.scope, duration_hours: Number(form.duration) }),
      });
      if (!res.ok) throw new Error(await errorDetail(res));
      const body = await res.json();
      response.actions = [body, ...response.actions];
      const ok = (body.targets || []).filter((t) => t.ok).length;
      response.message = `${body.ip} blokkolva ${ok}/${(body.targets || []).length} agenten` +
        (body.iris_noted ? ", IRIS note hozzáadva." : ".");
      response.error = body.status !== "sent";
    } catch (err) {
      response.message = "Sikertelen blokkolás: " + err.message;
      response.error = true;
    }
    response.busy = false;
    rerender();
  }

  // --- Kornyezo esemenyek a Wazuh indexerbol ---

  const around = { state: "idle", minutes: 15, events: [], error: "", enabled: true };

  function levelClass(level) {
    if (level >= 12) return "l-crit";
    if (level >= 8) return "l-high";
    if (level >= 5) return "l-med";
    return "l-low";
  }

  function tlTime(iso) {
    const d = new Date(iso);
    return isNaN(d.getTime()) ? escapeHtml(iso || "") : d.toLocaleTimeString("hu-HU");
  }

  function surroundingPanel() {
    if (!around.enabled) return "";
    const options = [5, 15, 60].map((m) => `<option value="${m}" ${m === around.minutes ? "selected" : ""}>±${m} perc</option>`).join("");
    let body;
    if (around.state === "loading") body = '<div class="hint">Betöltés a Wazuh indexerből...</div>';
    else if (around.state === "error") body = `<div class="hint" style="color:#f29b9b">Nem sikerült lekérni: ${escapeHtml(around.error)}</div>`;
    else if (!around.events.length) body = '<div class="hint">Nincs más esemény ebben az időablakban.</div>';
    else body = `<div class="timeline">${around.events.map((e) => {
      const meta = [e.agent, e.srcip && `forrás: ${e.srcip}`, e.user && `user: ${e.user}`, e.location].filter(Boolean).map(escapeHtml).join(" · ");
      return `<div class="tl-row ${e.this_alert ? "self" : ""}">
        <span class="tl-time">${tlTime(e.time)}</span>
        <span class="tl-level ${levelClass(e.level || 0)}" title="Wazuh szint">${escapeHtml(e.level ?? "-")}</span>
        <div class="tl-main">
          <div class="tl-rule">${escapeHtml(e.rule || "-")} <span class="tl-meta">#${escapeHtml(e.rule_id || "-")}</span>${e.this_alert ? '<span class="self-tag">ez a riasztás</span>' : ""}</div>
          ${meta ? `<div class="tl-meta">${meta}</div>` : ""}
          ${e.log ? `<div class="tl-log">${escapeHtml(e.log)}</div>` : ""}
        </div>
      </div>`;
    }).join("")}</div>`;
    return `<h2 class="panel-title">Környező események</h2>
      <div class="panel" style="display:block">
        <div class="tl-tools">
          <select id="aroundMinutes" aria-label="Időablak">${options}</select>
          <span class="hint">Ugyanarról a hostról (a manager riasztásainál ugyanarról a forrás IP-ről), minden Wazuh-szinten.</span>
        </div>
        ${body}
      </div>`;
  }

  async function loadSurrounding(a) {
    around.state = "loading";
    rerender();
    try {
      const res = await SIEM.api(`/api/v1/alerts/${encodeURIComponent(a.display_id)}/surrounding?minutes=${around.minutes}`);
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.detail || `HTTP ${res.status}`);
      around.enabled = body.enabled;
      around.events = body.events || [];
      around.state = "done";
    } catch (err) {
      around.state = "error";
      around.error = err.message;
    }
    rerender();
  }

  function bindSurrounding(a) {
    const sel = document.getElementById("aroundMinutes");
    if (sel) sel.addEventListener("change", () => { around.minutes = Number(sel.value); loadSurrounding(a); });
  }

  function rerender() {
    if (view) render(view.a, view.irisBaseUrl, view.info);
  }

  function render(a, irisBaseUrl, info) {
    view = { a, irisBaseUrl, info };
    document.title = `SIEMantics - ${a.display_id}`;
    const sev = severityInfo(a.severity);
    const st = statusInfo(a.status);
    const disp = dispositionInfo(a.ground_truth);

    const fields = [];
    const analysis = a.llm_analysis || null;
    if (analysis && analysis.summary) {
      fields.push(field("Összefoglaló", escapeHtml(analysis.summary), { fullWidth: true }));
    }
    if (a.review_reason && a.status === "needs_review") {
      fields.push(field("Felülvizsgálat oka", escapeHtml(a.review_reason), { fullWidth: true, cls: "review-reason" }));
    }
    fields.push(field("Azonosító", escapeHtml(a.display_id)));
    fields.push(field("Wazuh alert ID", escapeHtml(a.alert_id)));
    fields.push(field("Host", escapeHtml(a.agent_name || "-")));
    fields.push(field("Forrás IP", escapeHtml(a.source_ip || "-")));
    fields.push(field("Beérkezett", fmtTime(a.received_at)));
    fields.push(field("Feldolgozási idő", `${Math.round(a.processing_time_ms)} ms`));
    if (a.triage_engine != null) fields.push(field("Triázs motor", escapeHtml(a.triage_engine)));
    if (a.triage_model) fields.push(field("Modell", escapeHtml(a.triage_model)));
    if (a.llm_confidence != null) fields.push(field("Confidence", Math.round(a.llm_confidence * 100) + "%"));
    if (a.llm_is_true_positive != null) {
      fields.push(field("LLM döntés", a.llm_is_true_positive ? "True positive" : "False positive"));
    }
    if (a.ground_truth) {
      fields.push(field("Ground truth", escapeHtml(a.ground_truth) + (a.labeled_at ? " (" + fmtTime(a.labeled_at) + ")" : "")));
    }
    if (a.escalated_by) {
      const auto = a.auto_status ? statusInfo(a.auto_status).label : "-";
      fields.push(field("Kézi eszkaláció",
        `${escapeHtml(a.escalated_by.full_name || a.escalated_by.username)}${a.escalated_at ? " (" + fmtTime(a.escalated_at) + ")" : ""} — automatikus döntés: ${escapeHtml(auto)}`));
    }
    if (a.iris_case_id != null) {
      const link = irisBaseUrl
        ? `<a class="iris-link" href="${escapeHtml(irisBaseUrl)}/case?cid=${encodeURIComponent(a.iris_case_id)}" target="_blank" rel="noopener">Case #${escapeHtml(a.iris_case_id)} megnyitása az IRIS-ben ↗</a>`
        : `Case #${escapeHtml(a.iris_case_id)}`;
      fields.push(field("DFIR-IRIS eset", link));
      const closed = info ? info.closed : !!a.case_closed_at;
      let state = closed ? (a.case_closed_at ? `Lezárva (${fmtTime(a.case_closed_at)})` : "Lezárva") : "Nyitott";
      if (info && info.closed && info.outcome) state += ` · ${info.outcome}`;
      fields.push(field("Eset állapota", escapeHtml(state)));
      const note = info ? info.closure_annotation : a.case_closure_note;
      if (closed || note) {
        fields.push(field("Lezárási annotáció", note ? escapeHtml(note) : '<span class="hint">Nincs megadva</span>',
          { fullWidth: true, cls: "closure-note" }));
      }
      if (a.correlated_with) {
        fields.push(field("Korrelálva",
          `<a href="alert.html?id=${encodeURIComponent(a.correlated_with)}">${escapeHtml(a.correlated_with)}</a> esetébe került (azonos forrás IP, hasonló riasztás)`));
      }
      const owner = a.assignee
        ? escapeHtml(a.assignee.full_name || a.assignee.username) + (a.assigned_at ? " (" + fmtTime(a.assigned_at) + " óta)" : "")
        : "Nincs felelős";
      fields.push(field("Felelős", owner));
    }
    const tiField = renderTiSection(a);
    if (tiField) fields.push(tiField);
    if (a.llm_reasoning) {
      fields.push(field("LLM indoklás", escapeHtml(a.llm_reasoning), { fullWidth: true, mono: true }));
    }
    fields.push(...renderAnalysisFields(analysis));
    if (a.error_detail) {
      fields.push(field("Hiba", escapeHtml(a.error_detail), { fullWidth: true, mono: true }));
    }

    content.innerHTML = `
      <h1>${escapeHtml(a.rule_description)}</h1>
      <div class="sub">${escapeHtml(a.display_id)} · ${escapeHtml(a.alert_id)}</div>
      <div class="badges-row">
        ${badge(sev.label, sev.cls)}
        ${badge(st.label, st.cls)}
        ${badge(disp.label, disp.cls)}
      </div>
      <div class="panel">${fields.join("")}</div>
      ${surroundingPanel()}
      ${responsePanel(a)}
    `;
    bindResponse(a);
    bindSurrounding(a);
  }

  async function load() {
    if (!alertId) {
      content.innerHTML = '<div class="state error">Hiányzó alert azonosító (?id=...).</div>';
      return;
    }
    try {
      const [alertRes, configRes] = await Promise.all([
        SIEM.api(`/api/v1/alerts/${encodeURIComponent(alertId)}`),
        SIEM.api("/api/v1/config").catch(() => null),
      ]);
      if (!alertRes.ok) throw new Error(`HTTP ${alertRes.status}`);
      const alertData = await alertRes.json();
      const configData = configRes && configRes.ok ? await configRes.json() : {};
      response.enabled = !!configData.response_enabled;
      render(alertData, configData.iris_base_url || "", null);
      loadSurrounding(alertData);
      if (alertData.iris_case_id != null) {
        // Az IRIS eset elo allapota (annotacio) utolag, hogy a lap ne varjon az IRIS-re.
        SIEM.api(`/api/v1/cases/${encodeURIComponent(alertData.iris_case_id)}`)
          .then((r) => (r.ok ? r.json() : null))
          .then((info) => { if (info) { view.info = info; rerender(); } })
          .catch(() => {});
      }
      if (response.enabled) {
        // Valaszlepes: a felhasznalo szerepe (admin indithat) es a korabbi lepesek.
        Promise.all([
          SIEM.me().catch(() => null),
          SIEM.api(`/api/v1/alerts/${encodeURIComponent(alertData.display_id)}/responses`)
            .then((r) => (r.ok ? r.json() : [])).catch(() => []),
        ]).then(([user, actions]) => {
          response.user = user;
          response.actions = actions;
          rerender();
        });
      }
    } catch (err) {
      content.innerHTML = `<div class="state error">Nem sikerült betölteni a riasztást: ${escapeHtml(err.message)}</div>`;
    }
  }

  load();
})();
</script>
</body>
</html>
